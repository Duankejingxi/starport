<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星港 Starport — 火星城市建造</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loading">
  <div style="font-size:48px">🚀</div>
  <div style="font-size:18px;font-weight:bold;margin:12px 0;color:#facc15">星港 Starport</div>
  <div style="font-size:13px;opacity:.7">正在加载火星…</div>
</div>
<div id="app">
  <!-- 顶栏：城市评级 + 资源 -->
  <header id="topbar">
    <div id="city-info">
      <span id="city-rank">🏕️ 聚落</span>
      <small id="city-next"></small>
      <span id="disaster-ind"></span>
      <span id="tech-count"></span>
    </div>
    <div id="res-bar" class="collapsed">
      <div class="res key"><span>🟤</span><span id="res-iron">0</span></div>
      <div class="res key"><span>💧</span><span id="res-water">0</span></div>
      <div class="res key"><span>⚡</span><span id="res-power">0/0</span></div>
      <div class="res key"><span>👥</span><span id="res-pop">2/2</span></div>
      <button id="btn-res-expand" aria-label="展开资源">＋</button>
      <div class="res"><span>🧊</span><span id="res-ice">0</span></div>
      <div class="res"><span>🟣</span><span id="res-rare">0</span></div>
      <div class="res"><span>🌾</span><span id="res-food">0</span></div>
      <div class="res"><span>🔩</span><span id="res-steel">0</span></div>
      <div class="res"><span>🔬</span><span id="res-tech">0</span></div>
      <div class="res"><span>☢️</span><span id="res-uranium">0</span></div>
      <div class="res"><span>🌌</span><span id="res-he3">0</span></div>
      <div class="res"><span id="sector-count">🗺️ 1/9</span></div>
    </div>
  </header>

  <!-- 地图 -->
  <div id="map-wrap">
    <canvas id="map" width="660" height="660"></canvas>
    <div id="zoom-ctrl">
      <button id="zoom-in" aria-label="放大">＋</button>
      <span id="zoom-level">1x</span>
      <button id="zoom-out" aria-label="缩小">－</button>
      <button id="zoom-reset" aria-label="重置视角">🎯</button>
    </div>
    <div id="toast" class="hidden"></div>
    <!-- 建筑详情面板 -->
    <div id="building-panel" class="hidden">
      <div id="bp-title"></div>
      <div id="bp-desc"></div>
      <div id="bp-btns">
        <button id="btn-upgrade">⬆️ 升级</button>
        <button id="btn-repair" style="display:none">🔧 维修</button>
        <button id="btn-demolish" class="danger">💥 拆除</button>
        <button id="btn-building-extra" style="display:none"></button>
        <button id="btn-close-panel">✖</button>
      </div>
    </div>
    <!-- 科技树面板 -->
    <div id="tech-panel" class="hidden">
      <div class="panel-header">
        <b>🔬 科技树</b>
        <button id="btn-close-tech">✖</button>
      </div>
      <div id="tech-tree"></div>
    </div>
    <!-- 运输车面板 -->
    <div id="truck-panel" class="hidden">
      <div class="panel-header">
        <b>🚚 运输车队</b>
        <button id="btn-close-truck">✖</button>
      </div>
      <div id="truck-list"></div>
      <button id="btn-build-truck">🚚 建造运输车（铁×20 稀土×10）</button>
    </div>
    <!-- 贸易面板 -->
    <div id="trade-panel" class="hidden">
      <div class="panel-header">
        <b>🤝 地球贸易</b>
        <button id="btn-close-trade">✖</button>
      </div>
      <div id="trade-list"></div>
      <div style="font-size:11px;opacity:.6;margin-top:8px">每 60 秒刷新一次价格（当前固定）</div>
    </div>
    <!-- 成就面板 -->
    <div id="achieve-panel" class="hidden">
      <div class="panel-header">
        <b>🏆 成就</b>
        <button id="btn-close-achieve">✖</button>
      </div>
      <div id="achieve-stats" class="tech-stats"></div>
      <div id="achieve-list"></div>
    </div>
    <!-- 统计面板 -->
    <div id="stats-panel" class="hidden">
      <div class="panel-header">
        <b>📊 统计</b>
        <button id="btn-close-stats">✖</button>
      </div>
      <div id="stats-list"></div>
    </div>
    <!-- 帮助面板 -->
    <div id="help-panel" class="hidden">
      <div class="panel-header">
        <b>❓ 帮助手册</b>
        <button id="btn-close-help">✖</button>
      </div>
      <div id="help-nav"></div>
      <div id="help-content"></div>
    </div>
    <!-- 建筑菜单（v2.1 重构：分类 + 卡片） -->
    <div id="build-menu" class="hidden">
      <div class="panel-header">
        <b>🏗️ 建造</b>
        <button id="btn-close-buildmenu">✖</button>
      </div>
      <div id="build-cats"></div>
      <div id="build-cards"></div>
    </div>
    <!-- 更多菜单（v2.1 重构） -->
    <div id="more-menu" class="hidden">
      <div class="panel-header">
        <b>⚙️ 更多</b>
        <button id="btn-close-moremenu">✖</button>
      </div>
      <div id="more-grid"></div>
    </div>
    <!-- 图层菜单（v2.1 重构） -->
    <div id="overlay-menu" class="hidden">
      <div class="panel-header">
        <b>🗺️ 图层</b>
        <button id="btn-close-overlaymenu">✖</button>
      </div>
      <div id="overlay-list"></div>
    </div>
    <!-- 取消建造（v2.1） -->
    <button id="btn-cancel-build" class="hidden"></button>
    <!-- 小地图 -->
    <canvas id="minimap" width="120" height="120"></canvas>
    <!-- 教程 -->
    <div id="tutorial" class="hidden">
      <div id="tut-progress"></div>
      <div id="tut-title"></div>
      <div id="tut-text"></div>
      <div id="tut-hint"></div>
      <div id="tut-btns">
        <button id="btn-tut-prev">◀ 上一步</button>
        <button id="btn-tut-next">跳过教程</button>
      </div>
    </div>
    <!-- 胜利 -->
    <div id="victory" class="hidden">
      <div id="victory-inner">
        <div style="font-size:48px">🚀</div>
        <h2>发射成功！</h2>
        <p>你的城市建成了发射台，<br>第一艘飞船离开了火星。</p>
        <p style="opacity:.7">可以继续自由建造，冲击「星港」评级！</p>
        <button id="btn-continue">继续建造</button>
      </div>
    </div>
  </div>

  <!-- 底栏：操作（v2.1 重构：5 键） -->
  <footer id="toolbar">
    <button id="btn-harvest" class="tool-btn">⛏️<small>采集</small></button>
    <button id="btn-build-menu" class="tool-btn">🏗️<small>建造</small></button>
    <button id="btn-tech" class="tool-btn">🔬<small>科技</small></button>
    <button id="btn-overlay" class="tool-btn">🗺️<small>图层</small></button>
    <button id="btn-more" class="tool-btn">⚙️<small>更多</small></button>
  </footer>
  <div id="build-info" class="hidden"></div>
  <div id="v15-panel" class="hidden"></div>
  <div id="hint">🏗️建造 → 选建筑 → 点空地放置 · 点建筑查看/升级 · 点迷雾扇区解锁（铁×50）</div>
</div>

<!-- ============================================================
     星港 v2.0「经纬万象」快捷键速查（2026-11-05）
     ------------------------------------------------------------
     覆盖层：  1=电网  2=水管  3=交通  0=关闭
     工具：    B=建造  E=电缆  R=水管  T=道路
     面板：    F1=电网教程  F2=水管教程  F3=交通教程  F4=经济教程
     剧本：    F8=剧本选择器
     通用：    Space=暂停  +/-=速度  Esc=取消
     ------------------------------------------------------------
     v2.0 模块（按加载顺序）：
       1. powergrid.js      电网系统
       2. waternet.js       水管系统
       3. transit.js        交通深化
       4. economy.js        经济系统
       5. buildings_v20.js  30 新建筑
       6. ui_v20.js         UI（覆盖层/面板/教程）
       7. v20_integration.js 集成层
       8. v20_balance.js    数值验算
       9. v20_scenarios.js  10 挑战剧本
      10. v20_whatsnew.js   更新说明
      11. manual_v20.js     30 章手册
     ============================================================ -->
